# Mossy Skills - Mistral Vibe Agent Configuration
# This file registers mossy-skills as an agent for Mistral Vibe
# Users can either:
# 1. Symlink this repo to ~/.vibe/agents/mossy-skills
# 2. Add this repository path to their ~/.config/vibe/agents.toml

[[agents]]
name = "mossy-skills"
path = "."
description = "Mossy Code Flow Skills - Lean, token-efficient skills for planning and executing code changes"
# Optional: If you want to reference a specific version
tag = "main"

